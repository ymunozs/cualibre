# Construye los instaladores de macOS (.dmg) y Windows (setup .exe), y los PRUEBA
# ya instalados antes de publicarlos.
# Se ejecuta manualmente (Actions → Installers → Run workflow) o al subir un tag v*.
# Los instaladores quedan como "Artifacts" del run; con tag, además en un Release
# en borrador: se publica a mano cuando están los tres archivos (el DMG de Intel
# se construye fuera de este workflow, ver más abajo).

name: Installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Suite de tests en los sistemas reales de los usuarios (Windows y macOS):
  # rutas, codificaciones y reemplazo atómico de archivos se comportan distinto.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Pytest
        run: uv run -m pytest backend/tests/ -q

  # Solo Apple Silicon (macos-14) queda automático: se probó (v1.7.3,
  # 2026-07-07) que el pool hosted de GitHub para macos-13 (Intel) puede
  # quedar sin capacidad disponible por horas, atascando este job y con
  # él el "release" completo (needs: [mac, windows] espera TODAS las
  # instancias del matrix). El DMG Intel se sigue construyendo — pero
  # localmente en una Mac Intel real con packaging/build_mac.sh — y se
  # sube a mano con `gh release upload` junto a los artefactos de este
  # workflow. Si GitHub restaura capacidad estable de macos-13, se puede
  # volver a añadir aquí como segunda entrada del matrix.
  mac:
    needs: tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build .app + DMG (incluye la prueba de la app empaquetada)
        run: |
          chmod +x packaging/build_mac.sh packaging/smoke_test.sh
          ./packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CUA-LIBRE-Studio-mac-applesilicon
          path: dist/*.dmg

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versión (sale de pyproject.toml; un tag debe coincidir con ella)
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "El tag $env:GITHUB_REF_NAME no coincide con la versión $version de pyproject.toml"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Dependencies
        run: python -m pip install fastapi uvicorn pymupdf python-docx olefile python-multipart httpx pyinstaller "spacy>=3.8,<3.9" "numpy==1.26.4" "pywebview>=5.3" "winrt-runtime>=2.2" "winrt-Windows.Media.Ocr>=2.2" "winrt-Windows.Graphics.Imaging>=2.2" "winrt-Windows.Storage.Streams>=2.2" "winrt-Windows.Globalization>=2.2" "winrt-Windows.Foundation>=2.2" "winrt-Windows.Foundation.Collections>=2.2" https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl
      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name "CUA-LIBRE Studio"
          --icon packaging/cualibre.ico
          --add-data "frontend;frontend"
          --add-data "MANUAL.md;."
          --add-data "MANUAL.en.md;."
          --add-data "MANUAL.pt.md;."
          --add-data "LICENSE;."
          --add-data "AVISOS-DE-TERCEROS.md;."
          --add-data "licencias;licencias"
          --collect-all es_core_news_sm
          --collect-all en_core_web_sm
          --collect-all pt_core_news_sm
          --collect-all webview
          --collect-all winrt
          run.py
      - name: Inno Setup
        shell: pwsh
        env:
          CUALIBRE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\cualibre.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Lo que haría una persona: instalar sin administrador, abrir la app,
      # importar un .doc, actualizar y desinstalar; también con tildes en la ruta
      - name: Prueba del instalador
        shell: pwsh
        run: ./packaging/windows/smoke_test.ps1 -Version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: CUA-LIBRE-Studio-windows
          path: dist/*-windows-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # En borrador: falta el DMG de Intel (se sube con `gh release upload`) y
      # las notas. Mientras tanto «latest» sigue siendo la versión anterior, así
      # los enlaces de descarga del README nunca apuntan a un Release incompleto.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
